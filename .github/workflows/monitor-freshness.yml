name: Chart freshness monitor

on:
  # Manual diagnosis only. No scheduled polling or automatic incident issues.
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: 'Maximum age of the verified published snapshot (hours)'
        required: false
        default: '24'
        type: choice
        options: ['8', '24', '48', '72']

concurrency:
  group: chart-freshness-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CHART_MAX_AGE_HOURS: ${{ inputs.max_age_hours || '24' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Fetch actual published artifacts (not source branch)
        id: fetch_assets
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/activity-assets:refs/remotes/origin/activity-assets
          mkdir -p /tmp/chart-published
          git archive origin/activity-assets | tar -xf - -C /tmp/chart-published
      - name: Verify published checksums, numerical totals, and SVG XML
        id: integrity
        shell: bash
        run: |
          set -euo pipefail
          node verify-activity-assets.js /tmp/chart-published
          python3 ci/validate-svg.py /tmp/chart-published
      - name: Evaluate snapshot freshness
        id: freshness
        run: node ci/check-freshness.js /tmp/chart-published/manifest.json
      - name: Record manual diagnostic outcome
        if: always()
        shell: bash
        env:
          FETCH_OUTCOME: ${{ steps.fetch_assets.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.integrity.outcome }}
          FRESHNESS_OUTCOME: ${{ steps.freshness.outcome }}
        run: |
          {
            echo '## Chart freshness (manual diagnostic)'
            echo "- Fetch: ${FETCH_OUTCOME:-not-run}"
            echo "- Integrity: ${INTEGRITY_OUTCOME:-not-run}"
            echo "- Freshness: ${FRESHNESS_OUTCOME:-not-run}"
            echo "- Configured max age: ${CHART_MAX_AGE_HOURS} hours"
            echo '- Source: verified published activity-assets manifest'
            echo '- No issue is opened and no scheduled monitor is started'
          } >> "$GITHUB_STEP_SUMMARY"
