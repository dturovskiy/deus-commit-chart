name: Chart freshness monitor

on:
  # Manual diagnosis only. No scheduled polling or automatic incident issues.
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: 'Maximum age of the verified published snapshot (hours)'
        required: false
        default: '24'
        type: choice
        options: ['8', '24', '48', '72']
      max_schedule_gap_hours:
        description: 'Maximum time since the last delivered schedule event (hours)'
        required: false
        default: '2'
        type: choice
        options: ['2', '6', '24']

concurrency:
  group: chart-freshness-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      CHART_MAX_AGE_HOURS: ${{ inputs.max_age_hours || '24' }}
      CHART_MAX_SCHEDULE_GAP_HOURS: ${{ inputs.max_schedule_gap_hours || '2' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Fetch actual published artifacts (not source branch)
        id: fetch_assets
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/activity-assets:refs/remotes/origin/activity-assets
          mkdir -p /tmp/chart-published
          git archive origin/activity-assets | tar -xf - -C /tmp/chart-published
      - name: Verify published checksums, numerical totals, and SVG XML
        id: integrity
        shell: bash
        run: |
          set -euo pipefail
          node verify-activity-assets.js /tmp/chart-published
          python3 ci/validate-svg.py /tmp/chart-published
      - name: Evaluate snapshot freshness
        id: freshness
        run: node ci/check-freshness.js /tmp/chart-published/manifest.json
      - name: Inspect scheduled delivery independently of publication freshness
        id: schedule_delivery
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # A missing GitHub schedule event is an external delivery warning,
          # not a failure to execute this read-only diagnostic. Actual scheduled
          # run failures, API errors, and invalid responses must still fail.
          CHART_SCHEDULE_GAP_ADVISORY: 'true'
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-pages.yml/runs?per_page=100" > /tmp/chart-schedule-runs.json
          node ci/check-run-delivery.js /tmp/chart-schedule-runs.json | tee /tmp/chart-schedule-report.log
      - name: Record manual diagnostic outcome
        if: always()
        shell: bash
        env:
          FETCH_OUTCOME: ${{ steps.fetch_assets.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.integrity.outcome }}
          FRESHNESS_OUTCOME: ${{ steps.freshness.outcome }}
          SCHEDULE_OUTCOME: ${{ steps.schedule_delivery.outcome }}
        run: |
          {
            echo '## Chart freshness (manual diagnostic)'
            echo "- Fetch: ${FETCH_OUTCOME:-not-run}"
            echo "- Integrity: ${INTEGRITY_OUTCOME:-not-run}"
            echo "- Published snapshot freshness: ${FRESHNESS_OUTCOME:-not-run}"
            echo "- Schedule diagnostic execution: ${SCHEDULE_OUTCOME:-not-run}"
            if [[ -f /tmp/chart-schedule-report.log ]] && grep -q '"status":"schedule_delivery_gap"' /tmp/chart-schedule-report.log; then
              echo '- **Schedule health: WARN — GitHub schedule delivery gap (not a successful delivery)**'
            elif [[ "${SCHEDULE_OUTCOME:-not-run}" == 'failure' ]]; then
              echo '- **Schedule health: FAIL — inspect the failed diagnostic step**'
            else
              echo '- Schedule health: see structured result below'
            fi
            echo "- Configured max published age: ${CHART_MAX_AGE_HOURS} hours"
            echo "- Configured max schedule gap: ${CHART_MAX_SCHEDULE_GAP_HOURS} hours"
            echo '- Artifact source: verified published activity-assets manifest'
            echo '- Schedule source: GitHub Actions run history (not SVG generatedAt)'
            if [[ -f /tmp/chart-schedule-report.log ]]; then
              echo '```json'
              sed 's/^SCHEDULE_DELIVERY //' /tmp/chart-schedule-report.log
              echo '```'
            fi
            echo '- No issue is opened and no scheduled monitor is started'
          } >> "$GITHUB_STEP_SUMMARY"
