name: Publish activity charts

on:
  push:
    branches: [main]
    paths:
      - 'generate-commit-chart.js'
      - 'contribution-snapshot.js'
      - 'build-activity-assets.js'
      - 'verify-activity-assets.js'
      - 'modern-renderer.js'
      - 'action.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'test/**'
      - '.github/workflows/publish-pages.yml'
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

concurrency:
  group: activity-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify code and regressions
        run: npm run check
      - name: Fetch GitHub calendar once and render every range
        env:
          DEUS_COMMIT_CHART_GITHUB_TOKEN: ${{ secrets.DEUS_COMMIT_CHART_TOKEN || github.token }}
        run: |
          node build-activity-assets.js \
            --source github \
            --username "${{ github.repository_owner }}" \
            --out-dir dist \
            --default-days 30 \
            --layout spacious \
            --hide-border \
            --title "GitHub contribution activity"
      - name: Verify all generated artifacts
        run: node verify-activity-assets.js dist
      - name: Retain immutable verified build evidence
        uses: actions/upload-artifact@v4
        with:
          name: contribution-chart-verified-${{ github.run_id }}
          path: dist/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

  publish:
    # Allow workflow_dispatch on a review branch to exercise real GitHub GraphQL
    # and verify the generated artifacts without modifying production assets.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: contribution-chart-verified-${{ github.run_id }}
          path: dist/
      - name: Reverify exact downloaded artifacts
        run: node verify-activity-assets.js dist
      - name: Publish with fast-forward history (no force push)
        env:
          TARGET_BRANCH: activity-assets
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          cp -a dist/. "$temp_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$TARGET_BRANCH"
          git switch -C "$TARGET_BRANCH" FETCH_HEAD
          git rm -r --ignore-unmatch . >/dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$temp_dir"/. .
          git add -A
          if git diff --cached --quiet; then
            echo "No change in verified activity assets."
            exit 0
          fi
          git commit -m "chore: refresh verified activity charts"
          # Conflicting concurrent changes reject the push; previous verified assets remain.
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
