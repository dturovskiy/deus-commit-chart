name: Publish activity charts

on:
  # Publishing is a data refresh, NOT CI. Four times per day, like the original.
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: activity-assets
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout trusted source without persisting write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # Dependency-free source build; no package setup or regression suite.
      - name: Fetch GitHub calendar once and render every range
        env:
          DEUS_COMMIT_CHART_GITHUB_TOKEN: ${{ secrets.DEUS_COMMIT_CHART_TOKEN || github.token }}
        run: |
          node build-activity-assets.js \
            --source github \
            --username "${{ github.repository_owner }}" \
            --out-dir dist \
            --default-days 30 \
            --layout spacious \
            --hide-border \
            --title "GitHub contribution activity"
      - name: Verify all generated artifacts, checksums and numerical contract
        run: node verify-activity-assets.js dist
      - name: Validate SVG XML and embedded-resource policy
        run: python3 ci/validate-svg.py dist
      - name: Publish with fast-forward history (no force push)
        env:
          TARGET_BRANCH: activity-assets
          # Only this publish step receives the GitHub write token. Checkout
          # does not persist it to .git/config or expose it to generation.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          previous_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir" "$previous_dir"' EXIT
          cp -a dist/. "$temp_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$TARGET_BRANCH"
          git archive FETCH_HEAD | tar -xf - -C "$previous_dir"
          # Two unchanged samples should not create two Git commits or cache churn.
          # Both full asset bundles are independently verified before comparison.
          decision=0
          node ci/should-publish.js "$previous_dir" dist || decision=$?
          if [[ "$decision" -eq 0 ]]; then
            echo "Verified contribution data and source revision unchanged; keeping published snapshot."
            exit 0
          fi
          if [[ "$decision" -ne 1 ]]; then
            echo "Could not safely compare published snapshots." >&2
            exit "$decision"
          fi
          git switch -C "$TARGET_BRANCH" FETCH_HEAD
          git rm -r --ignore-unmatch . >/dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$temp_dir"/. .
          git add -A
          if git diff --cached --quiet; then
            echo "No change in verified activity assets."
            exit 0
          fi
          git commit -m "chore: refresh verified activity charts"
          # Conflicting concurrent changes reject the push; previous verified assets remain.
          # Use ephemeral gh credential helper; do not persist credentials,
          # embed a token in the remote URL, or print one in argv/logs.
          git -c credential.helper= -c credential.helper='!gh auth git-credential' \
            push origin "HEAD:refs/heads/$TARGET_BRANCH"
