name: Publish activity charts

on:
  push:
    branches: [main]
    paths:
      - 'generate-commit-chart.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publish-pages.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-assets
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish activity assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build interactive report
        env:
          DEUS_COMMIT_CHART_GITHUB_TOKEN: ${{ secrets.DEUS_COMMIT_CHART_TOKEN || github.token }}
        run: |
          node generate-commit-chart.js \
            --source github \
            --username "${{ github.repository_owner }}" \
            --days 90 \
            --out dist/index.html \
            --title "GitHub contribution activity"

      - name: Build README-safe SVG ranges
        env:
          DEUS_COMMIT_CHART_GITHUB_TOKEN: ${{ secrets.DEUS_COMMIT_CHART_TOKEN || github.token }}
        run: |
          set -euo pipefail
          for days in 30 90 365; do
            node generate-commit-chart.js \
              --source github \
              --username "${{ github.repository_owner }}" \
              --format svg \
              --days "$days" \
              --theme github-compact \
              --hide-border \
              --out "dist/activity-${days}d.svg" \
              --title "GitHub contribution activity"
          done
          touch dist/.nojekyll

      - name: Publish generated branch
        env:
          TARGET_BRANCH: activity-assets
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          cp -a dist/. "$temp_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan "$TARGET_BRANCH"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$temp_dir"/. .
          git add -A
          git commit -m "chore: refresh generated activity charts"
          git push --force origin "$TARGET_BRANCH"
