name: Audit GitHub README chart cache

on:
  # Manual-only diagnostic; never spend scheduled runner/artifact resources.
  workflow_dispatch:

concurrency:
  group: chart-cache-audit
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read the published production manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/activity-assets:refs/remotes/origin/activity-assets
          git show origin/activity-assets:manifest.json > /tmp/published-chart-manifest.json
      - name: Compare rendered profile image proxy with published snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/probe-readme-cache.py /tmp/published-chart-manifest.json cache-audit.json
          cat cache-audit.json >> "$GITHUB_STEP_SUMMARY"
