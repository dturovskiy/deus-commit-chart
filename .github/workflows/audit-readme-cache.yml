name: Audit GitHub README chart cache

on:
  # Manual-only diagnostic; never spend scheduled runner/artifact resources.
  workflow_dispatch:
    inputs:
      samples:
        description: 'Read-only observations: one sample, or three at 15-second intervals'
        type: choice
        required: false
        default: '1'
        options: ['1', '3']

concurrency:
  group: chart-cache-audit
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the published production manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/activity-assets:refs/remotes/origin/activity-assets
          git show origin/activity-assets:manifest.json > /tmp/published-chart-manifest.json
      - name: Sample actual README image with bounded manual observations
        shell: bash
        env:
          CHART_CACHE_SAMPLES: ${{ inputs.samples || '1' }}
        run: |
          set -euo pipefail
          python3 ci/sample-readme-cache.py /tmp/published-chart-manifest.json cache-audit.json "$CHART_CACHE_SAMPLES"
          cat cache-audit.json >> "$GITHUB_STEP_SUMMARY"
