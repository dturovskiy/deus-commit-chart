name: Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: Generator smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tracked source for accidentally committed credentials
        run: python3 ci/check_secrets.py

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Validate syntax and run numerical regression suite
        run: npm run check

      - name: Run canonical npm test command
        run: npm test

      - name: Test read-only GitHub cache probe without network
        run: python3 -m unittest discover -s test -p 'test_*.py' -v

      - name: Create fixture git repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/deus-commit-chart-fixture
          cd /tmp/deus-commit-chart-fixture
          git init -b main
          git config user.name "Smoke Test"
          git config user.email "smoke@example.local"
          yesterday="$(date -u -d 'yesterday' +%F)"
          today="$(date -u +%F)"
          echo "one" > fixture.txt
          git add fixture.txt
          GIT_AUTHOR_DATE="${yesterday}T10:00:00Z" \
          GIT_COMMITTER_DATE="${yesterday}T10:00:00Z" \
          git commit -m "fixture: yesterday"
          echo "two" >> fixture.txt
          git add fixture.txt
          GIT_AUTHOR_DATE="${today}T10:00:00Z" \
          GIT_COMMITTER_DATE="${today}T10:00:00Z" \
          git commit -m "fixture: today one"
          echo "three" >> fixture.txt
          git add fixture.txt
          GIT_AUTHOR_DATE="${today}T11:00:00Z" \
          GIT_COMMITTER_DATE="${today}T11:00:00Z" \
          git commit -m "fixture: today two"

      - name: Smoke composite GitHub Action
        uses: ./
        with:
          source: local
          repo: /tmp/deus-commit-chart-fixture
          branch: main
          default-days: '30'
          ranges: '30,90,365'
          layout: spacious
          output-dir: .tmp/action-smoke
          title: Action smoke chart

      - name: Verify composite Action output
        shell: bash
        run: |
          set -euo pipefail
          test -s .tmp/action-smoke/index.html
          node verify-activity-assets.js .tmp/action-smoke
          python3 ci/validate-svg.py .tmp/action-smoke
          grep -q '30 days · 3 commits' .tmp/action-smoke/activity-30d.svg
          for days in 30 90 365; do
            test -s ".tmp/action-smoke/activity-${days}d.svg"
            grep -q '^<svg ' ".tmp/action-smoke/activity-${days}d.svg"
          done

      - name: Real headless Chromium QA for both themes and all ranges (same PR-only job)
        shell: bash
        run: |
          set -euo pipefail
          node ci/browser-smoke.js .tmp/action-smoke/index.html
          node build-activity-assets.js \
            --source local \
            --repo /tmp/deus-commit-chart-fixture \
            --branch main \
            --theme github-light \
            --layout spacious \
            --out-dir .tmp/browser-light \
            --title "Light theme Chromium QA"
          node verify-activity-assets.js .tmp/browser-light
          python3 ci/validate-svg.py .tmp/browser-light
          node ci/browser-smoke.js .tmp/browser-light/index.html

      - name: Rehearse failed publish and forward-only rollback on a local test remote
        shell: bash
        run: |
          set -euo pipefail
          node build-activity-assets.js \
            --source local \
            --repo /tmp/deus-commit-chart-fixture \
            --branch main \
            --out-dir .tmp/rollback-second \
            --title "Rollback verification candidate"
          bash ci/rehearse-rollback.sh .tmp/action-smoke .tmp/rollback-second

      - name: Generate interactive HTML
        run: |
          node generate-commit-chart.js \
            --repo /tmp/deus-commit-chart-fixture \
            --branch main \
            --days 90 \
            --out /tmp/deus-commit-chart-smoke.html \
            --title "Smoke chart"

      - name: Verify HTML range switcher
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/deus-commit-chart-smoke.html
          grep -q "Smoke chart" /tmp/deus-commit-chart-smoke.html
          grep -q 'data-range="30"' /tmp/deus-commit-chart-smoke.html
          grep -q 'data-range="90"' /tmp/deus-commit-chart-smoke.html
          grep -q 'data-range="365"' /tmp/deus-commit-chart-smoke.html
          grep -q '<svg id="chart"' /tmp/deus-commit-chart-smoke.html
          grep -q 'Range switches rebuild the SVG in-browser' /tmp/deus-commit-chart-smoke.html
          grep -q "chart-data" /tmp/deus-commit-chart-smoke.html

      - name: Generate README-safe SVGs
        shell: bash
        run: |
          set -euo pipefail
          for days in 30 90 365; do
            node generate-commit-chart.js \
              --repo /tmp/deus-commit-chart-fixture \
              --branch main \
              --format svg \
              --days "$days" \
              --layout spacious \
              --out "/tmp/deus-commit-chart-${days}d.svg" \
              --title "Smoke chart"
          done

      - name: Verify SVG output
        shell: bash
        run: |
          set -euo pipefail
          for days in 30 90 365; do
            file="/tmp/deus-commit-chart-${days}d.svg"
            test -s "$file"
            grep -q '^<svg ' "$file"
            grep -q 'viewBox="0 0 1120 410"' "$file"
            grep -q 'data-chart-series="daily-bars"' "$file"
            grep -q 'data-series="trend"' "$file"
            grep -q '>7d trend</text>' "$file"
            if grep -qi '<script' "$file"; then
              echo "SVG must not contain scripts: $file" >&2
              exit 1
            fi
          done
